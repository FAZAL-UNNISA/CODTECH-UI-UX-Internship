<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mailchimp - Marketing Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #241c15;
      line-height: 1.5;
    }

    /* Navigation Bar */
    .navbar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: #241c15;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background-color: #ffe01b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #241c15;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #241c15;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-links a:hover {
      color: #007c89;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #241c15;
      display: flex;
      align-items: center;
    }

    .btn-login {
      text-decoration: none;
      color: #241c15;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 22px;
      border: 1px solid #241c15;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: #f6f6f4;
    }

    /* Hero Section */
    .hero {
      max-width: 760px;
      margin: 48px auto 56px;
      padding: 0 24px;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 46px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      color: #241c15;
    }

    .hero p {
      font-size: 17px;
      color: #403b37;
      max-width: 440px;
      margin: 0 auto 28px;
    }

    .btn-signup {
      display: inline-block;
      background-color: #007c89;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 2px;
      transition: background-color 0.2s;
    }

    .btn-signup:hover {
      background-color: #006570;
    }

    /* Feature Grid */
    .features {
      max-width: 980px;
      margin: 0 auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 32px;
      text-align: center;
    }

    .feature-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-illustration {
      width: 170px;
      height: 115px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feature-card h3 {
      font-size: 16px;
      font-weight: 700;
      color: #241c15;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero h1 { font-size: 34px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <a href="#" class="logo">
      <span class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#241c15" stroke-width="2">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="9" cy="10" r="1" fill="#241c15"/>
          <circle cx="15" cy="10" r="1" fill="#241c15"/>
          <path d="M9 15c1.5 1.5 4.5 1.5 6 0"/>
        </svg>
      </span>
      mailchimp
    </a>

    <ul class="nav-links">
      <li><a href="#">Marketing Platform <span>&#9662;</span></a></li>
      <li><a href="#">Email Marketing <span>&#9662;</span></a></li>
      <li><a href="#">Resources <span>&#9662;</span></a></li>
    </ul>

    <div class="nav-actions">
      <button class="search-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="20" y1="20" x2="16.2" y2="16.2"/>
        </svg>
      </button>
      <a href="#" class="btn-login">Log In</a>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Grow your business with Mailchimp’s all-in-one marketing platform.</h1>
    <p>Get powerful features to help you find and engage customers.</p>
    <a href="#" class="btn-signup">Sign Up</a>
  </section>

  <!-- Features Grid -->
  <section class="features">
    <!-- Audience -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="150" height="105" viewBox="0 0 150 105">
          <circle cx="52" cy="36" r="13" fill="#c79c7e" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="75" cy="30" r="14" fill="#a8d5ba" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="98" cy="36" r="13" fill="#f4d5b8" stroke="#241c15" stroke-width="1.5"/>
          <path d="M35 72c0-11 8-18 18-18s18 7 18 18" fill="#e07a5f" stroke="#241c15" stroke-width="1.5"/>
          <path d="M80 72c0-11 8-18 18-18s18 7 18 18" fill="#81b29a" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="62" cy="54" r="12" fill="#f2cc8f" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="88" cy="54" r="12" fill="#8d5524" stroke="#241c15" stroke-width="1.5"/>
          <path d="M36 92c0-12 9-20 20-20s20 8 20 20" fill="#241c15"/>
          <path d="M74 92c0-12 9-20 20-20s20 8 20 20" fill="#3d8e83" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="75" cy="64" r="13" fill="#6b4423" stroke="#241c15" stroke-width="1.5"/>
          <path d="M55 96c0-11 9-18 20-18s20 7 20 18" fill="#d9cbb8" stroke="#241c15" stroke-width="1.5"/>
        </svg>
      </div>
      <h3>Audience</h3>
    </div>

    <!-- Email templates -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="160" height="105" viewBox="0 0 160 105">
          <rect x="20" y="24" width="38" height="58" fill="#e9e4d9" stroke="#241c15" stroke-width="1.5"/>
          <rect x="26" y="34" width="26" height="22" fill="#8ecae6" stroke="#241c15" stroke-width="1.2"/>
          <rect x="102" y="24" width="38" height="58" fill="#e9e4d9" stroke="#241c15" stroke-width="1.5"/>
          <rect x="108" y="34" width="26" height="22" fill="#8ecae6" stroke="#241c15" stroke-width="1.2"/>
          <rect x="54" y="12" width="52" height="82" rx="3" fill="#ffffff" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="80" cy="24" r="6" fill="#241c15"/>
          <rect x="64" y="36" width="32" height="22" fill="#ffe01b" stroke="#241c15" stroke-width="1.5"/>
          <polyline points="64,36 80,49 96,36" fill="none" stroke="#241c15" stroke-width="1.5"/>
          <rect x="68" y="68" width="24" height="8" rx="2" fill="#8ecae6" stroke="#241c15" stroke-width="1.2"/>
        </svg>
      </div>
      <h3>Email templates</h3>
    </div>

    <!-- Reporting dashboards -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="160" height="105" viewBox="0 0 160 105">
          <rect x="24" y="16" width="106" height="68" rx="4" fill="#ffffff" stroke="#241c15" stroke-width="1.5"/>
          <line x1="24" y1="28" x2="130" y2="28" stroke="#241c15" stroke-width="1.5"/>
          <rect x="30" y="34" width="24" height="44" fill="#f4f1ea"/>
          <polygon points="62,62 76,46 92,52 108,38 122,46 122,62" fill="#ffe01b" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="118" cy="72" r="18" fill="#8ecae6" stroke="#241c15" stroke-width="1.5"/>
          <path d="M118 72 L118 54 A18 18 0 0 1 136 72 Z" fill="#ffe01b" stroke="#241c15" stroke-width="1.5"/>
        </svg>
      </div>
      <h3>Reporting dashboards</h3>
    </div>

    <!-- Analytics -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="150" height="90" viewBox="0 0 150 90">
          <rect x="48" y="16" width="66" height="46" fill="#f4f1ea" stroke="#241c15" stroke-width="1.5"/>
          <polyline points="56,50 74,36 88,42 104,26" fill="none" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="72" cy="52" r="16" fill="#8ecae6" fill-opacity="0.5" stroke="#241c15" stroke-width="2"/>
          <line x1="84" y1="63" x2="98" y2="76" stroke="#241c15" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Automation -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="150" height="90" viewBox="0 0 150 90">
          <rect x="34" y="18" width="82" height="58" rx="3" fill="#ffffff" stroke="#241c15" stroke-width="1.5"/>
          <rect x="34" y="18" width="22" height="58" fill="#3d8e83" stroke="#241c15" stroke-width="1.5"/>
          <rect x="64" y="28" width="44" height="8" fill="#ffe01b" stroke="#241c15" stroke-width="1.2"/>
          <line x1="64" y1="46" x2="104" y2="46" stroke="#241c15" stroke-width="1.5"/>
          <line x1="64" y1="54" x2="94" y2="54" stroke="#241c15" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- E-commerce -->
    <div class="feature-card">
      <div class="feature-illustration">
        <svg width="150" height="90" viewBox="0 0 150 90">
          <rect x="48" y="10" width="54" height="74" rx="8" fill="#3d8e83" stroke="#241c15" stroke-width="1.5"/>
          <rect x="53" y="16" width="44" height="62" rx="4" fill="#ffffff" stroke="#241c15" stroke-width="1.2"/>
          <polygon points="64,30 88,30 84,44 67,44" fill="#ffe01b" stroke="#241c15" stroke-width="1.5"/>
          <circle cx="69" cy="49" r="2.5" fill="#241c15"/>
          <circle cx="82" cy="49" r="2.5" fill="#241c15"/>
        </svg>
      </div>
    </div>
  </section>

</body>
</html>
